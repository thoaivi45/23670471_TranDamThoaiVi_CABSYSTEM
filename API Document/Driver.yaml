openapi: 3.0.3
info:
  title: CAB System - Driver & Vehicle API
  version: 1.0.0
  description: Driver profile, availability and vehicle endpoints.
servers:
- url: http://localhost:3000/api/v1
  description: Local development server
tags:
- name: Drivers
paths:
  /drivers/me:
    get:
      tags:
      - Drivers
      summary: Get my driver profile
      operationId: getMyDriverProfile
      description: Returns the authenticated Driver profile.
      security:
      - bearerAuth: []
      x-srs-trace:
        br:
        - BR05
        fr:
        - FR18
        ac:
        - AC18
      responses:
        '200':
          description: Driver profile returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Driver role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - Drivers
      summary: Update my driver profile
      operationId: updateMyDriverProfile
      description: Updates Driver profile information.
      security:
      - bearerAuth: []
      x-srs-trace:
        br:
        - BR05
        fr:
        - FR18
        ac:
        - AC18
      responses:
        '200':
          description: Driver profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '400':
          description: Invalid driver data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Driver role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverProfileRequest'
  /drivers/me/status:
    patch:
      tags:
      - Drivers
      summary: Update availability status
      operationId: updateDriverAvailability
      description: Allows a Driver not currently in an active Trip to switch between
        AVAILABLE and OFFLINE.
      security:
      - bearerAuth: []
      x-srs-trace:
        br:
        - BR05
        fr:
        - FR17
        ac:
        - AC17
        rules:
        - RULE02
        - RULE04
      responses:
        '200':
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Driver role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Status change conflicts with an active Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
  /drivers/me/vehicle:
    get:
      tags:
      - Drivers
      summary: Get my vehicle
      operationId: getMyVehicle
      description: Returns the vehicle linked to the authenticated Driver.
      security:
      - bearerAuth: []
      x-srs-trace:
        br:
        - BR05
        fr:
        - FR18
        ac:
        - AC18
      responses:
        '200':
          description: Vehicle returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Driver role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags:
      - Drivers
      summary: Create or update my vehicle
      operationId: upsertMyVehicle
      description: Creates or updates Driver vehicle information.
      security:
      - bearerAuth: []
      x-srs-trace:
        br:
        - BR05
        fr:
        - FR18
        ac:
        - AC18
        rules:
        - RULE03
      responses:
        '200':
          description: Vehicle saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          description: Invalid vehicle data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Driver role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request data is invalid
        details:
          type: object
          additionalProperties: true
    DriverProfile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        licenseNumber:
          type: string
        availability:
          type: string
          enum:
          - AVAILABLE
          - OFFLINE
          - BUSY
        ratingAverage:
          type: number
          format: float
    UpdateDriverProfileRequest:
      type: object
      properties:
        licenseNumber:
          type: string
    DriverStatusRequest:
      type: object
      required:
      - availability
      properties:
        availability:
          type: string
          enum:
          - AVAILABLE
          - OFFLINE
    Vehicle:
      type: object
      properties:
        id:
          type: string
        plateNumber:
          type: string
        vehicleType:
          type: string
        model:
          type: string
    VehicleRequest:
      type: object
      required:
      - plateNumber
      - vehicleType
      properties:
        plateNumber:
          type: string
        vehicleType:
          type: string
        model:
          type: string
