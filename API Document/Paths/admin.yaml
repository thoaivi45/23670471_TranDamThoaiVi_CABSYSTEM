admin_customers:
  get:
    tags:
      - Admin

    summary: Xem và tìm kiếm khách hàng

    operationId: adminGetCustomers

    description: |
      Operations Staff xem và tìm kiếm Customer.
      Phục vụ FR22 và AC19.

    parameters:

      - $ref: ../components/parameters.yaml#/SearchQuery

    responses:

      '200':
        description: Lấy danh sách Customer thành công

        content:
          application/json:

            schema:
              type: array

              items:
                $ref: ../components/schemas.yaml#/CustomerSummary

      '401':
        $ref: ../components/responses.yaml#/Unauthorized

      '403':
        $ref: ../components/responses.yaml#/Forbidden


admin_drivers:
  get:
    tags:
      - Admin

    summary: Xem và tìm kiếm tài xế

    operationId: adminGetDrivers

    description: |
      Operations Staff xem và tìm kiếm Driver.
      Phục vụ FR23 và AC20.

    parameters:

      - $ref: ../components/parameters.yaml#/SearchQuery

    responses:

      '200':
        description: Lấy danh sách Driver thành công

        content:
          application/json:

            schema:
              type: array

              items:
                $ref: ../components/schemas.yaml#/DriverSummary

      '401':
        $ref: ../components/responses.yaml#/Unauthorized

      '403':
