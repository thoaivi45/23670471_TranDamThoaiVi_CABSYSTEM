admin_trips:
  get:
    tags:
      - Admin

    summary: Xem danh sách chuyến đi

    operationId: adminGetTrips

    description: |
      Operations Staff xem và theo dõi các Trip.
      Phục vụ FR24 và AC21.

    parameters:

      - name: status
        in: query
        required: false

        schema:
          type: string

          enum:
            - SEARCHING_DRIVER
            - DRIVER_ASSIGNED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED

    responses:

      '200':
        description: Lấy danh sách Trip thành công

        content:
          application/json:

            schema:
              type: array

              items:
                $ref: ../components/schemas.yaml#/Trip

      '401':
        $ref: ../components/responses.yaml#/Unauthorized

      '403':
        $ref: ../components/responses.yaml#/Forbidden


admin_reports_summary:
  get:
    tags:
      - Admin

    summary: Xem báo cáo tổng quan

    operationId: adminGetReportSummary

    description: |
      Operations Staff xem thống kê số chuyến và doanh thu.
      Phục vụ FR27 và AC16.

    responses:

      '200':
        description: Lấy báo cáo thành công

        content:
          application/json:

            schema:
              $ref: ../components/schemas.yaml#/ReportSummary

      '401':
        $ref: ../components/responses.yaml#/Unauthorized

      '403':
        $ref: ../components/responses.yaml#/Forbidden
